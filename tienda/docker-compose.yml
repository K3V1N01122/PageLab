# Entorno de producción de referencia: PostgreSQL + aplicación + nginx.
#   cp .env.example .env   (completar SECRET_KEY, POSTGRES_PASSWORD, PUBLIC_BASE_URL)
#   docker compose up -d --build
#   docker compose exec app python manage.py create-admin
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tienda}
      POSTGRES_USER: ${POSTGRES_USER:-tienda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tienda}"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tienda}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tienda}
      SERVE_FRONTEND: "false"
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      db: { condition: service_healthy }
    volumes: [uploads:/data/uploads]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/srv/frontend:ro
      - uploads:/srv/uploads:ro

volumes:
  pgdata:
  uploads:
