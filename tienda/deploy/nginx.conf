# nginx delante de la aplicación: sirve estáticos, comprime y hace de proxy.
# Para HTTPS, termine TLS aquí (certbot) o en el balanceador, y mantenga
# SESSION_COOKIE_SECURE=true en la aplicación.
upstream app { server app:8000; keepalive 32; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Código del frontend: sin hash en el nombre, así que caché corta con revalidación.
    location ~ ^/(src|styles|assets)/ {
        root /srv/frontend;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Imágenes subidas: nombres únicos, caché larga.
    location /uploads/ {
        alias /srv/uploads/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # API y páginas HTML (el backend inserta los metadatos SEO en cada página).
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
